name: Collect YouBike Immediate Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-youbike
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect YouBike data
        run: python scripts/collect_youbike.py

      - name: Write heartbeat file
        run: |
          mkdir -p data
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone(timedelta(hours=8))).isoformat()
          with open("data/last_run.txt","w",encoding="utf-8") as f:
              f.write(now + "\n")
          PY

      - name: Commit and push updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/youbike.sqlite3
          git commit -m "chore: update YouBike immediate data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
